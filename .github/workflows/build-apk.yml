name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Copy icon for asset generation
        run: |
          mkdir -p assets
          cp www/icons/icon.png assets/icon.png

      - name: Generate Android icons
        run: npx @capacitor/assets generate --android

      # ВАЖНО: этот шаг должен идти ПОСЛЕ `cap add android` (иначе папки android/
      # ещё не существует) и ДО `cap sync` (чтобы веб-ассеты синхронизировались
      # уже поверх готового нативного проекта). Он копирует классы будильника
      # (AlarmReceiver/AlarmService/AlarmActivity/BootReceiver/NativeAlarmPlugin,
      # переопределённый MainActivity, layout, иконку) и патчит AndroidManifest.xml.
      # Без этого шага все нативные доработки будильника исчезают при каждой
      # пересборке, так как android/ не хранится в репозитории.
      - name: Patch native alarm sources into generated Android project
        run: python3 scripts/patch-android.py

      - name: Generate Alarm Sound Resource (fallback tone if no user asset)
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 -c "
          import wave, struct, math
          with wave.open('android/app/src/main/res/raw/alarm.wav', 'wb') as f:
              f.setnchannels(1)
              f.setsampwidth(2)
              f.setframerate(22050)
              samples = [int(16000 * math.sin(2 * 3.14159 * 880 * t / 22050)) for t in range(22050 * 2)]
              f.writeframes(b''.join(struct.pack('<h', s) for s in samples))
          "

      - name: Sync web files
        run: npx cap sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
