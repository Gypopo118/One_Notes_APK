<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#333335">
<title>Заметки</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html,body{background:#333335;}</style>
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
<!-- Предохранитель: если основные скрипты не выполнились за 5 с —
     принудительно показываем интерфейс, чтобы не было вечного чёрного экрана -->
<script>
(function(){
  var t=setTimeout(function(){
    if(!document.body.classList.contains('ready')){
      document.body.style.opacity='1';
    }
  },5000);
  // Если ready появился раньше — отменяем таймер
  var o=new MutationObserver(function(){
    if(document.body.classList.contains('ready')){clearTimeout(t);o.disconnect();}
  });
  o.observe(document.body,{attributes:true,attributeFilter:['class']});
})();
</script>

<div id="app">

  <!-- Top bar: appears only while an editor is open -->
  <header id="topbar" class="topbar hidden">
    <button id="closeEditorBtn" class="icon-btn" aria-label="Назад">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="topbarTitle" class="topbar-title"></div>
    <button id="clearAllBtn" class="clear-btn" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l1.5 13a2 2 0 002 1.8h5a2 2 0 002-1.8L18 6M4 6h16M9 6V4.5A1.5 1.5 0 0110.5 3h3A1.5 1.5 0 0115 4.5V6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Очистить</span>
    </button>
  </header>

  <!-- List views: Срочно / Планы -->
  <main id="listView" class="view list-view">
    <div id="cardsContainer" class="cards-container"></div>
    <button id="newNoteBtn" class="new-note-fab" type="button" aria-label="Новая заметка">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </main>

  <!-- Fullscreen editor for a Срочно/Планы card -->
  <section id="editorView" class="view editor-view hidden">
    <div id="editorCard" class="editor-card">
      <textarea id="editorTextarea" class="editor-textarea" placeholder="Введите текст…"></textarea>
      <div class="editor-footer">
        <button id="reminderBtn" class="reminder-btn" type="button">Установить срок</button>
        <button id="sendBtn" class="send-btn" type="button" aria-label="Сохранить и закрыть">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 19V5M12 5l-6 6M12 5l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Fullscreen single-field views: Купить продукты / Купить вещи -->
  <section id="shoppingView" class="view shopping-view hidden">
    <div class="editor-card">
      <textarea id="shoppingTextarea" class="editor-textarea" placeholder="Начните вводить…"></textarea>
    </div>
  </section>

  <!-- Inline confirm overlay for delete (positioned over the trash icon) -->
  <div id="confirmPopover" class="confirm-popover hidden">
    <span class="confirm-label">Удалить?</span>
    <button id="confirmYes" class="confirm-yes">Да</button>
  </div>

  <!-- Reminder set/edit modal -->
  <div id="reminderModal" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <h3>Установить срок</h3>
      <input id="reminderInput" type="datetime-local">
      <div class="modal-actions">
        <button id="reminderCancel" class="modal-cancel" type="button">Отмена</button>
        <button id="reminderClear" class="modal-clear" type="button">Убрать</button>
        <button id="reminderSave" class="modal-save" type="button">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- Bottom navigation -->
  <nav id="bottomNav" class="bottom-nav">
    <button class="nav-btn nav-urgent" data-tab="urgent">
      <span class="nav-badge" id="badgeUrgent">0</span>
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2a6 6 0 00-6 6c0 4-2 5-2 6h16c0-1-2-2-2-6a6 6 0 00-6-6zM9.5 19a2.5 2.5 0 005 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>срочно</span>
    </button>
    <button class="nav-btn nav-plans" data-tab="plans">
      <span class="nav-badge" id="badgePlans">0</span>
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>планы</span>
    </button>
    <button class="nav-btn nav-buy" data-tab="buy">
      <span class="nav-badge" id="badgeBuy">0</span>
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 4h2l2.4 12.4a2 2 0 002 1.6h7.2a2 2 0 002-1.6L20 8H6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="21" r="1.2" fill="currentColor"/><circle cx="16" cy="21" r="1.2" fill="currentColor"/></svg>
      <span>купить</span>
    </button>
    <button class="nav-btn nav-notebook" data-tab="things">
      <span class="nav-badge nav-badge-dot hidden" id="badgeThings"></span>
      <svg viewBox="0 0 24 24" width="20" height="20"><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5 6.5H3.3M5 10.5H3.3M5 14.5H3.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>блокнот</span>
    </button>
  </nav>

</div>

<script src="js/db.js?v=4"></script>
<script src="js/reminders.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
